<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #0F5B3E;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6EC;display:flex;flex-direction:column;font-family:'Mukta',sans-serif;color:#1F2A24;overflow:hidden">

    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="background:#FBEBC4;color:#7A5200;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px">2 to sync</div>

    </div>
  </div>

  <div style="display:flex;gap:10px;padding:8px 20px">
    <label style="flex:1;display:flex;align-items:center;gap:8px;height:52px;box-sizing:border-box;padding:0 14px;background:#FFFFFF;border:1.5px solid #E6DCC8;border-radius:14px">

        <span><span style="display:block;font-size:15px;font-weight:600;line-height:1.2">Toor Dal</span><span style="display:block;font-size:13px;color:#5C655F">₹165 / kg</span></span>
        <span style="width:32px;height:32px;border-radius:999px;background:#E4F0E8;color:#0F5B3E;display:flex;align-items:center;justify-content:center;flex:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>

      <div style="font-size:13px;color:#5C655F">3 items</div>
    </div>

      </div>
      <div style="width:64px;text-align:right;font-size:15px;font-weight:700;padding-right:8px">₹90</div>
    </div>

        <div style="font-size:15px;font-weight:600;line-height:1.2">Fortune Sunflower Oil 1L</div>
        <div style="font-size:13px;color:#5C655F">1 × ₹155</div>
      </div>
      <div style="display:flex;align-items:center">
        <button style="width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center" aria-label="Reduce Sunflower Oil"><span style="width:30px;height:30px;border-radius:999px;background:#F3EBDA;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></span></button>

        <div style="font-size:13px;color:#5C655F">2 × ₹14</div>

        <button style="width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center" aria-label="Reduce Maggi"><span style="width:30px;height:30px;border-radius:999px;background:#F3EBDA;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></span></button>
        <div style="min-width:20px;text-align:center;font-size:16px;font-weight:700">2</div>
        <button style="width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center" aria-label="Add more Maggi"><span style="width:30px;height:30px;border-radius:999px;background:#E4F0E8;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F5B3E" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
      </div>
      <div style="width:64px;text-align:right;font-size:15px;font-weight:700;padding-right:8px">₹28</div>
    </div>
  </div>

  <div style="display:flex;align-items:flex-end;justify-content:space-between;padding:12px 20px 8px">
    <div>
      <div style="font-size:14px;font-weight:600;color:#5C655F">Total</div>
      <div style="font-size:13px;color:#5C655F">incl. GST ₹14.67</div>
    </div>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:36px;line-height:1;color:#0F5B3E">₹273.00</div>
  </div>

  <div style="display:flex;gap:10px;padding:0 20px 12px">
    <button style="flex:1.4;height:56px;border:none;border-radius:14px;background:#0F5B3E;color:#FFFFFF;font-size:18px;font-weight:700">Cash</button>
    <button style="flex:1;height:56px;border:2px solid #0F5B3E;border-radius:14px;background:transparent;color:#0F5B3E;font-size:17px;font-weight:700">UPI</button>
    <button style="flex:1;height:56px;border:2px solid #0F5B3E;border-radius:14px;background:transparent;color:#0F5B3E;font-size:17px;font-weight:700">Khata</button>
  </div>

  <nav style="display:flex;height:64px;background:#FFFFFF;border-top:1px solid #E6DCC8" aria-label="Main">
    <a href="Main.dc.html" aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#0F5B3E;font-size:12px;font-weight:700">
